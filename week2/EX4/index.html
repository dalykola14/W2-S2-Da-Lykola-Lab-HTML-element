<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <title>Profile Card</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>

<body>
  <div class="card">
    <img id="pic" src="https://th.bing.com/th/id/OIP.cmWVkJEJvMZkCC5bEy6wHQAAAA?w=188&h=188&c=7&r=0&o=7&dpr=1.5&pid=1.7&rm=3">
    <h1 id="name">아이유(IU)</h1>
    <p class="role">Actor & Singer</p>
    <div class="stats">
      <div class="stat">
        <span>0</span>
        <p>Following</p>
      </div>
      <div class="stat">
        <span>4.9M</span>
        <p>Followers</p>
      </div>
      <div class="stat">
        <span>71.1M</span>
        <p>Likes</p>
      </div>
    </div>
    <p id="bio">아이유(IU) Official TikTok</p>
    <button class="btt">Follow</button>
    <button class="btt1">Message</button>
  </div>
</body>

</html>
